<html>
<head>
 <title>Sign in page</title>
<style>
*{
  margin:0;
  padding:0;
 }
 body{
	background-color:white;
	background-size:cover;
	background-position:center;
 }			
 .signin_box{
     width:420px;
     height:310px;
     margin:0 auto;
     background-color:#E8CBF2;
     border-radius:15px;
     border:3px solid #AF95BA;
     position:relative;
     z-index:3;
     top:230px;
	 box-sizing:border-box;
 } 
  .signin_box h1{
     width:100%;
     padding:15px;
     color:red;
     font-size:18px;
     font-weight:lighter;
     text-align:center;
     box-sizing:border-box;
  }
 .info{
     width:100%;
     height:80px;
     box-sizing:border-box;
     padding:10px 20px;
	 margin:10px 25px;
	 gap:20px;
 }
  .info p{
     width:80px;    
	 color:#AF95BA;
     font-size:18px;
     font-weight:lighter;
	 text-align:left;
	 vertical-align:middle;
	 display:inline-block;
  }
  .info input{
     width:220px;
	 height:30px;
	 margin-left:15px;
	 padding-left:10px;
	 border:2px solid #AF95BA;
     display:inline-block;
     background-color:white;
	 vertical-align:middle;
	 border-radius:10px;
	 box-sizing:border-box;
  }
  .button{
     width:80px;
	 height:30px;
	 margin:0px 170px 10px 170px;
	 border:2px solid #AF95BA;
     display:inline-block;
     background-color:white;
	 text-align:center;
	 border-radius:10px;
	 box-sizing:border-box;
	 color:red;
	 cursor:pointer;
  }
</style>
</head>
<body>
 
 <div class="signin_box">
   <h1>Login to your Account</h1>
   <div class="info">
       <p><label for="name">user name</label></p>
	   <input type="text" id="name" />
   </div>
   <div class="info">
       <p><label for="pass">Password</label></p>
	   <input type="password" id="pass" />
   </div>
       <button class="button">Sign in</button>
 </div>
 
</body>
</html>
